services:
  - type: web
    name: prep-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://yuv9799.github.io,https://prep-frontend-ochre.vercel.app,https://prep-frontend-yuviraj.vercel.app,http://localhost:5173
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_LOG_ONLY
        value: true
